<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Google_Clone</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
   <link rel="stylesheet" href="style.css";
</head>
<body>

   <!-- Header -->
    <div class="header">
      <div class="header_left">
         <a href="#">About</a>
         <a href="#">Store</a>
      </div>

      <div class="header_right">
         <a href="#">Gmail</a>
         <a href="#">Images</a>
         <a><i class="fa-solid fa-list-check"></i></a>
         <a><i class="fa-solid fa-circle-user"></i></a>
      </div>
      </div>

      <!-- main body -->
      <div class="mainBody">
      <img src="Images/google.png" 
      alt="Google Logo"> 


      <!-- Search -->
       <div class="search">
         <div class="search_input">
            <span class="fa-solid fa-magnifying-glass"></span>
            <input type="text">
            <span class="fa-solid fa-microphone"></span>
         </div>


         <div class="search_buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
         </div>

         <div class="offer_board">
            <div>Google offered in :</div>
            <a href="#"> हिन्दी বাংলা తెలుగు मराठी தமிழ் ગુજરાતી ಕನ್ನಡ മലയാളം ਪੰਜਾਬੀ</a>
         </div>
       </div>

       <!-- Footer -->
        <footer>
         <div class="yourCountry">India</div>
         <div class="options">
               <a>Advertising</a>
               <a>Business</a>
               <a>How Search works</a>
               <div class="infoSpace"></div>
               <a>Privacy</a>
               <a>Terms</a>
               <a>Settings</a>
         </div>
        </footer>

</body>
</html>
